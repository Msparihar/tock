[project]
name = "tock"
version = "0.1.0"
description = "A terminal alarm clock: alarms with snooze and repeats, a timer and a stopwatch."
readme = "README.md"
authors = [
    { name = "Manish Singh Parihar", email = "manishsparihar2020@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
tock = "tock.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=0.24",
    "textual-serve>=1.1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
